<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Bidify</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #141923;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1c2333;
      border: 1px solid #2a3347;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      background: rgba(233, 195, 73, 0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: #E9C349;
      letter-spacing: -0.5px;
    }
    .logo-sub {
      font-size: 0.82rem;
      color: #4b5a6e;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: -8px;
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }
    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #6b7d94;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    input {
      background: #141923;
      border: 1.5px solid #2a3347;
      border-radius: 10px;
      padding: 12px 14px;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #3d4f63; }
    input:focus {
      outline: none;
      border-color: #E9C349;
      box-shadow: 0 0 0 3px rgba(233, 195, 73, 0.12);
    }
    button {
      width: 100%;
      padding: 13px;
      background: #E9C349;
      color: #141923;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }
    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-area">
      <span class="logo-name">Bidify</span>
      <span class="logo-sub">Panel de Administración</span>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="admin"
               autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••"
               autocomplete="current-password">
      </div>
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
