app = "bidify-da1"
primary_region = "gru"

[build]

[env]
  DATABASE_URL = "sqlite:////data/subastas.db"
  MEDIA_DIR    = "/data/media"
  PORT         = "8080"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    timeout      = "5s"

[[mounts]]
  source      = "bidify_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
